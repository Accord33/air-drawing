<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="人差し指でカメラ映像に赤い線を描く、ブラウザ内だけで動くアプリ。">
  <title>Air Drawing</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="stage" aria-label="Air Drawing カメラと描画">
    <video id="camera" autoplay muted playsinline aria-label="左右反転しないカメラ映像"></video>
    <canvas id="drawing" aria-label="人差し指で描いた赤い線"></canvas>
  </main>
  <p id="status" role="status" aria-live="polite">カメラと手の認識を準備しています… カメラを許可してください。</p>
  <script type="module" src="./app.js"></script>
